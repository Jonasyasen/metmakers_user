<ion-header class="ion-no-border">
  <ion-toolbar mode="md">
    <ion-buttons slot="start">
      <ion-button (click)="onBack()" color="dark">
        <ion-icon slot="icon-only" name="arrow-back"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Notification</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="notification-setting-screen">
    <ion-item lines="none" class="item-content">
      <ion-label class="lbl">Special Offers</ion-label>
      <ion-toggle slot="end" color="secondary" mode="md" [checked]="true"></ion-toggle>
    </ion-item>
    <ion-item lines="none" class="item-content">
      <ion-label class="lbl">Sound</ion-label>
      <ion-toggle slot="end" color="secondary" mode="md"></ion-toggle>
    </ion-item>
    <ion-item lines="none" class="item-content">
      <ion-label class="lbl">Vibrate</ion-label>
      <ion-toggle slot="end" color="secondary" mode="md" [checked]="true"></ion-toggle>
    </ion-item>
    <ion-item lines="none" class="item-content">
      <ion-label class="lbl">General Notification</ion-label>
      <ion-toggle slot="end" color="secondary" mode="md"></ion-toggle>
    </ion-item>
    <ion-item lines="none" class="item-content">
      <ion-label class="lbl">Promo & Discount</ion-label>
      <ion-toggle slot="end" color="secondary" mode="md" [checked]="true"></ion-toggle>
    </ion-item>
    <ion-item lines="none" class="item-content">
      <ion-label class="lbl">Payment Options</ion-label>
      <ion-toggle slot="end" color="secondary" mode="md" [checked]="true"></ion-toggle>
    </ion-item>
    <ion-item lines="none" class="item-content">
      <ion-label class="lbl">App Update</ion-label>
      <ion-toggle slot="end" color="secondary" mode="md"></ion-toggle>
    </ion-item>
    <ion-item lines="none" class="item-content">
      <ion-label class="lbl">New Service Available</ion-label>
      <ion-toggle slot="end" color="secondary" mode="md"></ion-toggle>
    </ion-item>
    <ion-item lines="none" class="item-content">
      <ion-label class="lbl">New Tips Available</ion-label>
      <ion-toggle slot="end" color="secondary" mode="md" [checked]="true"></ion-toggle>
    </ion-item>
  </div>
</ion-content>
