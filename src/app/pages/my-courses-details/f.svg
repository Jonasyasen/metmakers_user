<svg xmlns="http://www.w3.org/2000/svg" width="400" height="450" viewBox="0 0 400 450">
  <!-- Hexagon som ramme -->
  <polygon points="300,200 250,286.6 150,286.6 100,200 150,113.4 250,113.4" 
           fill="none" stroke="#000000" stroke-width="3"/>
  
  <!-- Forbindelseslinjer fra sentrum til hvert hjørne -->
  <line x1="200" y1="200" x2="300" y2="200" stroke="#000000" stroke-width="2"/>
  <line x1="200" y1="200" x2="250" y2="286.6" stroke="#000000" stroke-width="2"/>
  <line x1="200" y1="200" x2="150" y2="286.6" stroke="#000000" stroke-width="2"/>
  <line x1="200" y1="200" x2="100" y2="200" stroke="#000000" stroke-width="2"/>
  <line x1="200" y1="200" x2="150" y2="113.4" stroke="#000000" stroke-width="2"/>
  <line x1="200" y1="200" x2="250" y2="113.4" stroke="#000000" stroke-width="2"/>
  
  <!-- Noder ved hexagonens hjørner -->
  <circle cx="300" cy="200" r="8" fill="#FFCD00"/>
  <circle cx="250" cy="286.6" r="8" fill="#FFCD00"/>
  <circle cx="150" cy="286.6" r="8" fill="#FFCD00"/>
  <circle cx="100" cy="200" r="8" fill="#FFCD00"/>
  <circle cx="150" cy="113.4" r="8" fill="#FFCD00"/>
  <circle cx="250" cy="113.4" r="8" fill="#FFCD00"/>
  
  <!-- Sentral node -->
  <circle cx="200" cy="200" r="10" fill="#FFCD00"/>
  
  <!-- Tekst: MET MAKERS -->
  <text x="200" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" fill="#000000" font-weight="bold">
    MET MAKERS
  </text>
</svg>
