<ion-header class="ion-no-border">
</ion-header>

<ion-content class="ion-padding student-id-card  " >
  <!-- بطاقة الهوية الإلكترونية مع علامة مائية SVG -->
  <ion-card class=" ">
    <!-- طبقة العلامة المائية -->
    <div class="watermark-overlay">
 
    </div>
    
    <ion-card-content>
      <!-- القسم العلوي: الصورة + الاسم/الهوية -->
      <div class="top-section">
        <img
          src="https://thumbs.dreamstime.com/b/happy-mature-business-woman-vertical-profile-picture-female-boss-businesswoman-portrait-successful-professional-businesslady-355202326.jpg"
          alt="Student Image"
          class="student-photo"
        />
        <div class="info">
          <h2>John Doe</h2>
          <p>ID: 123456789</p>
        </div>
      </div>

      <!-- القسم الأوسط: القسم والوظيفة/الحالة -->
      <div class="middle-section">
        <p>Department: Computer Science</p>
        <p>Status: Active</p>
      </div>

      <!-- القسم السفلي: أربع دوائر ملونة -->
      <div class="bottom-section color-circles">
        <div class="circle circle-red"></div>
        <div class="circle circle-blue"></div>
        <div class="circle circle-green"></div>
        <div class="circle circle-yellow"></div>
      </div>
    </ion-card-content>
  </ion-card>
</ion-content>
