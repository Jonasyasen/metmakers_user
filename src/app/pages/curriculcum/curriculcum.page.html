<ion-header class="ion-no-border">
  <ion-toolbar mode="ios">
    <ion-buttons slot="start">
      <ion-button (click)="onBack()" color="dark">
        <ion-icon slot="icon-only" name="arrow-back"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Curriculcum</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card class="curriculcum-screen" mode="ios">
    <div class="curriculcum-content">
      <div class="header-title">
        <ion-label class="lbl">
          Section 01 - <span class="active">Introductions</span>
        </ion-label>
        <ion-label class="lbl">
          <span class="active">55 Mins.</span>
        </ion-label>
      </div>

      <div class="curriculcum-list">
        <div class="curriculcum-content-data" *ngFor="let item of util.curriculcumList;">
          <div class="prefix">
            <div class="number">
              <ion-label class="time">
                {{item.number}}
              </ion-label>
            </div>
            <div class="name-content">
              <ion-label class="title">
                {{ (item.name.length>25)? (item.name | slice:0:25)+'..':(item.name) }}
              </ion-label>
              <ion-label class="total-time"> {{item.time}} </ion-label>
            </div>
          </div>
          <ion-icon name="play-circle" color="primary" class="play-btn-curriculcum"></ion-icon>
        </div>
      </div>
    </div>
  </ion-card>
</ion-content>

<ion-footer>
  <ion-toolbar>
    <div class="next-btn-login ion-activatable ripple-parent" [style.width.%]="100" (click)="onPage('payment-methods')">
      <ion-ripple-effect></ion-ripple-effect>
      <ion-label class="lbl">Enroll Course - ₹152</ion-label>
      <div class="btn">
        <ion-icon name="arrow-forward-outline" color="primary"></ion-icon>
      </div>
    </div>
  </ion-toolbar>
</ion-footer>
