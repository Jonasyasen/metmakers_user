<ion-header class="ion-no-border">
  <ion-toolbar mode="ios">
    <ion-buttons slot="start">
      <ion-button (click)="onBack()" color="dark">
        <ion-icon slot="icon-only" name="arrow-back"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Create New PIN</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="create-pin-screen">
    <ion-label class="title">Add a Pin Number to Make Your Account more Secure</ion-label>

    <div class="otp-content">
      <ng-otp-input
        [config]="{length:6,isPasswordInput:false,inputStyles:{'width': '50px','height': '50px','border':'1px solid lightgray','background-color':'#f3f3f3'},placeholder:'-'}"></ng-otp-input>
    </div>

    <div class="next-btn-login ion-activatable ripple-parent" [style.width.%]="100" (click)="onLogin()">
      <ion-ripple-effect></ion-ripple-effect>
      <ion-label class="lbl">Continue</ion-label>
      <div class="btn">
        <ion-icon name="arrow-forward-outline" color="primary"></ion-icon>
      </div>
    </div>
  </div>
</ion-content>
