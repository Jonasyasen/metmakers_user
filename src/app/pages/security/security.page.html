<ion-header class="ion-no-border">
  <ion-toolbar mode="md">
    <ion-buttons slot="start">
      <ion-button (click)="onBack()" color="dark">
        <ion-icon slot="icon-only" name="arrow-back"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Security</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="notification-setting-screen">
    <ion-item lines="none" class="item-content">
      <ion-label class="lbl">Remember Me</ion-label>
      <ion-toggle slot="end" color="secondary" mode="md" [checked]="true"></ion-toggle>
    </ion-item>
    <ion-item lines="none" class="item-content">
      <ion-label class="lbl">Biometric ID</ion-label>
      <ion-toggle slot="end" color="secondary" mode="md"></ion-toggle>
    </ion-item>
    <ion-item lines="none" class="item-content">
      <ion-label class="lbl">Face ID</ion-label>
      <ion-toggle slot="end" color="secondary" mode="md" [checked]="true"></ion-toggle>
    </ion-item>
    <ion-item lines="none" class="item-content">
      <ion-label class="lbl">Google Authenticator</ion-label>
      <ion-toggle slot="end" color="secondary" mode="md"></ion-toggle>
    </ion-item>
  </div>
</ion-content>

<ion-footer>
  <ion-toolbar>
    <div class="next-btn-login ion-activatable ripple-parent" [style.width.%]="100">
      <ion-ripple-effect></ion-ripple-effect>
      <ion-label class="lbl">Change Password</ion-label>
      <div class="btn">
        <ion-icon name="arrow-forward-outline" color="primary"></ion-icon>
      </div>
    </div>
  </ion-toolbar>
</ion-footer>
