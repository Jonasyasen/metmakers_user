<ion-header class="ion-no-border">
  <ion-toolbar mode="ios">
    <ion-buttons slot="start">
      <ion-button (click)="onBack()" color="dark">
        <ion-icon slot="icon-only" name="arrow-back"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>{{name}}</ion-title>
    <ion-buttons slot="end">
      <ion-button color="dark" (click)="onCall()">
        <ion-icon slot="icon-only" name="call-outline"></ion-icon>
      </ion-button>
      <ion-button color="dark">
        <ion-icon slot="icon-only" name="search-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="chat-inbox-screen">
    <div class="chat-list" *ngFor="let item of util.chatList">
      <div class="receiver" *ngIf="item.from =='a'">
        <div class="text-type">
          <ion-label class="msg">{{item.message}}</ion-label>
        </div>
      </div>
      <div class="sender" *ngIf="item.from =='b'">
        <div class="text-type">
          <ion-label class="msg">{{item.message}}</ion-label>
        </div>
      </div>
    </div>
  </div>
</ion-content>
<ion-footer>
  <ion-toolbar>
    <ion-row class="bottom-content-chat">
      <ion-col size="10">
        <ion-item lines="none" class="text-input">
          <ion-icon slot="start" name="happy-outline" color="medium"></ion-icon>
          <ion-textarea rows="1" placeholder="Type a message.."></ion-textarea>
          <ion-icon slot="end" name="attach-outline" color="medium"> </ion-icon>
          <ion-icon slot="end" name="camera-outline" color="medium"></ion-icon>
        </ion-item>
      </ion-col>
      <ion-col size="2">
        <div class="voice-btn">
          <ion-icon name="mic" color="light"></ion-icon>
        </div>
      </ion-col>
    </ion-row>
  </ion-toolbar>
</ion-footer>
